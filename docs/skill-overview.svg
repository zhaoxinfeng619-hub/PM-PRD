<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="800" rx="24" fill="#f4f7fb"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="54" font-size="32" fill="#172b4d" font-weight="700">PM-PRD · 产品经理全流程 Skill</text><text x="48" y="88" font-size="22" fill="#536780" font-weight="400">从一句需求，到可评审、可交互、可验收的产品方案</text><rect x="48" y="114" width="1104" height="66" rx="16" fill="#172b4d" stroke="none"/><text x="70" y="141" font-size="18" fill="#ffffff" font-weight="600">服务对象：产品经理、独立开发者与产品团队</text><text x="70" y="166" font-size="18" fill="#d4dfed" font-weight="400">输入业务背景与需求，按任务选择工作流，交付一组保持一致的产品文档。</text><text x="48" y="224" font-size="22" fill="#172b4d" font-weight="700">从需求到交付的工作流</text><rect x="48" y="248" width="252" height="164" rx="16" fill="#ffffff" stroke="#dae3ef"/><rect x="66" y="266" width="38" height="30" rx="8" fill="#eaf0ff" stroke="none"/><text x="73" y="287" font-size="17" fill="#345ec9" font-weight="700">01</text><text x="66" y="327" font-size="21" fill="#172b4d" font-weight="700">需求挖掘</text><text x="66" y="362" font-size="16" fill="#536780" font-weight="400">梳理用户问题与真实证据</text><text x="66" y="388" font-size="16" fill="#536780" font-weight="400">明确目标、范围与约束</text><path d="M306 330H325" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="332" y="248" width="252" height="164" rx="16" fill="#ffffff" stroke="#dae3ef"/><rect x="350" y="266" width="38" height="30" rx="8" fill="#eaf0ff" stroke="none"/><text x="357" y="287" font-size="17" fill="#345ec9" font-weight="700">02</text><text x="350" y="327" font-size="21" fill="#172b4d" font-weight="700">PRD 与交互原型</text><text x="350" y="362" font-size="16" fill="#536780" font-weight="400">定义功能规则与页面状态</text><text x="350" y="388" font-size="16" fill="#536780" font-weight="400">生成 HTML 文档和活原型</text><path d="M590 330H609" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="616" y="248" width="252" height="164" rx="16" fill="#ffffff" stroke="#dae3ef"/><rect x="634" y="266" width="38" height="30" rx="8" fill="#eaf0ff" stroke="none"/><text x="641" y="287" font-size="17" fill="#345ec9" font-weight="700">03</text><text x="634" y="327" font-size="21" fill="#172b4d" font-weight="700">流程图与验收</text><text x="634" y="362" font-size="16" fill="#536780" font-weight="400">梳理业务和交互流程</text><text x="634" y="388" font-size="16" fill="#536780" font-weight="400">生成可记录证据的验收清单</text><path d="M874 330H893" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="900" y="248" width="252" height="164" rx="16" fill="#ffffff" stroke="#dae3ef"/><rect x="918" y="266" width="38" height="30" rx="8" fill="#eaf0ff" stroke="none"/><text x="925" y="287" font-size="17" fill="#345ec9" font-weight="700">04</text><text x="918" y="327" font-size="21" fill="#172b4d" font-weight="700">数据分析与迭代</text><text x="918" y="362" font-size="16" fill="#536780" font-weight="400">核对指标、口径和数据质量</text><text x="918" y="388" font-size="16" fill="#536780" font-weight="400">形成结论与后续验证建议</text><text x="48" y="462" font-size="22" fill="#172b4d" font-weight="700">项目亮点</text><rect x="48" y="484" width="536" height="70" rx="12" fill="#ffffff" stroke="#dae3ef"/><text x="66" y="511" font-size="18" fill="#345ec9" font-weight="700">双栏活原型</text><text x="66" y="537" font-size="17" fill="#536780" font-weight="400">一边读需求，一边查看可交互页面</text><rect x="616" y="484" width="536" height="70" rx="12" fill="#ffffff" stroke="#dae3ef"/><text x="634" y="511" font-size="18" fill="#345ec9" font-weight="700">文档保持一致</text><text x="634" y="537" font-size="17" fill="#536780" font-weight="400">需求、原型、流程图与验收同步检查</text><rect x="48" y="570" width="536" height="70" rx="12" fill="#ffffff" stroke="#dae3ef"/><text x="66" y="597" font-size="18" fill="#345ec9" font-weight="700">编辑与带图复制</text><text x="66" y="623" font-size="17" fill="#536780" font-weight="400">支持正文编辑、缩放和带图复制</text><rect x="616" y="570" width="536" height="70" rx="12" fill="#ffffff" stroke="#dae3ef"/><text x="634" y="597" font-size="18" fill="#345ec9" font-weight="700">可复用与可定制</text><text x="634" y="623" font-size="17" fill="#536780" font-weight="400">初始化到不同项目，升级保留本地定制</text><rect x="48" y="680" width="1104" height="78" rx="12" fill="#e9eef6" stroke="none"/><text x="68" y="709" font-size="18" fill="#172b4d" font-weight="600">当前仓库：完整 Skill、模板、脚本、参考文件与自测</text><text x="68" y="737" font-size="17" fill="#536780" font-weight="400">基础使用需要 Python 3.9+；保存、截图与带图复制需配置本地浏览器服务。</text></g></svg>