<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="800" rx="24" fill="#f4f7fb"/><g font-family="PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif"><text x="48" y="54" font-size="32" fill="#172b4d" font-weight="700">学院 AI 作文诊断 H5</text><text x="48" y="88" font-size="22" fill="#536780" font-weight="400">让学生看懂这篇作文的问题，再找到下一步学习方向</text><rect x="48" y="114" width="1104" height="66" rx="16" fill="#172b4d" stroke="none"/><text x="70" y="141" font-size="18" fill="#ffffff" font-weight="600">服务对象：初高中学生及家长</text><text x="70" y="166" font-size="18" fill="#d4dfed" font-weight="400">业务场景：承接直播间与活动入口，把一次作文诊断连接到试听和练习。</text><text x="48" y="224" font-size="22" fill="#172b4d" font-weight="700">一条完整的体验链路</text><rect x="48" y="248" width="252" height="164" rx="16" fill="#ffffff" stroke="#dae3ef"/><rect x="66" y="266" width="38" height="30" rx="8" fill="#eaf0ff" stroke="none"/><text x="73" y="287" font-size="17" fill="#345ec9" font-weight="700">01</text><text x="66" y="327" font-size="21" fill="#172b4d" font-weight="700">填写写作情况</text><text x="66" y="362" font-size="16" fill="#536780" font-weight="400">年级、作文水平与提升方向</text><text x="66" y="388" font-size="16" fill="#536780" font-weight="400">为本次诊断提供上下文</text><path d="M306 330H325" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="332" y="248" width="252" height="164" rx="16" fill="#ffffff" stroke="#dae3ef"/><rect x="350" y="266" width="38" height="30" rx="8" fill="#eaf0ff" stroke="none"/><text x="357" y="287" font-size="17" fill="#345ec9" font-weight="700">02</text><text x="350" y="327" font-size="21" fill="#172b4d" font-weight="700">选择学科并上传</text><text x="350" y="362" font-size="16" fill="#536780" font-weight="400">支持语文 / 英语写作场景</text><text x="350" y="388" font-size="16" fill="#536780" font-weight="400">分别上传题目图与正文图</text><path d="M590 330H609" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="616" y="248" width="252" height="164" rx="16" fill="#ffffff" stroke="#dae3ef"/><rect x="634" y="266" width="38" height="30" rx="8" fill="#eaf0ff" stroke="none"/><text x="641" y="287" font-size="17" fill="#345ec9" font-weight="700">03</text><text x="634" y="327" font-size="21" fill="#172b4d" font-weight="700">获取 AI 诊断报告</text><text x="634" y="362" font-size="16" fill="#536780" font-weight="400">呈现诊断结果与成长称号</text><text x="634" y="388" font-size="16" fill="#536780" font-weight="400">定位当前作文的改进方向</text><path d="M874 330H893" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="900" y="248" width="252" height="164" rx="16" fill="#ffffff" stroke="#dae3ef"/><rect x="918" y="266" width="38" height="30" rx="8" fill="#eaf0ff" stroke="none"/><text x="925" y="287" font-size="17" fill="#345ec9" font-weight="700">04</text><text x="918" y="327" font-size="21" fill="#172b4d" font-weight="700">进入试听与练习</text><text x="918" y="362" font-size="16" fill="#536780" font-weight="400">从报告进入推荐课程</text><text x="918" y="388" font-size="16" fill="#536780" font-weight="400">连接专项练习与后续学习</text><text x="48" y="462" font-size="22" fill="#172b4d" font-weight="700">项目亮点</text><rect x="48" y="484" width="536" height="70" rx="12" fill="#ffffff" stroke="#dae3ef"/><text x="66" y="511" font-size="18" fill="#345ec9" font-weight="700">轻量进入</text><text x="66" y="537" font-size="17" fill="#536780" font-weight="400">移动 H5，承接微信与直播入口</text><rect x="616" y="484" width="536" height="70" rx="12" fill="#ffffff" stroke="#dae3ef"/><text x="634" y="511" font-size="18" fill="#345ec9" font-weight="700">场景适配</text><text x="634" y="537" font-size="17" fill="#536780" font-weight="400">按学科与英语写作类型区分输入</text><rect x="48" y="570" width="536" height="70" rx="12" fill="#ffffff" stroke="#dae3ef"/><text x="66" y="597" font-size="18" fill="#345ec9" font-weight="700">学习承接</text><text x="66" y="623" font-size="17" fill="#536780" font-weight="400">诊断结果连接试听课与专项练习</text><rect x="616" y="570" width="536" height="70" rx="12" fill="#ffffff" stroke="#dae3ef"/><text x="634" y="597" font-size="18" fill="#345ec9" font-weight="700">交付完整</text><text x="634" y="623" font-size="17" fill="#536780" font-weight="400">PRD、可交互原型、双流程图齐备</text><rect x="48" y="680" width="1104" height="78" rx="12" fill="#e9eef6" stroke="none"/><text x="68" y="709" font-size="18" fill="#172b4d" font-weight="600">当前仓库：需求设计与前端交互演示</text><text x="68" y="737" font-size="17" fill="#536780" font-weight="400">AI 诊断、真实图片上传及课程播放需后端接入；流程与能力以 PRD 约定为准。</text></g></svg>